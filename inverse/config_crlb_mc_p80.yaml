# Compact-recipe FIM vs Monte-Carlo inverse (pitch 80 nm)
# See docs/CRLB_MC.md
#
#   python3 run_crlb_mc.py --config config_crlb_mc_p80.yaml --mode layout
#   python3 run_crlb_mc.py --config config_crlb_mc_p80.yaml --mode fim
#   python3 run_crlb_mc.py --config config_crlb_mc_p80.yaml --mode probe
#   python3 run_crlb_mc.py --config config_crlb_mc_p80.yaml --mask decoupling --mode A

structure:
  pitch_nm: 80
  cd_nm: 40.0
  depth_nm: 40.0
  swa_deg: 89.45
  n_slices: 10
  grating_material: Au
  substrate_material: SiO2

optical:
  wl_nm: 14.55
  angle_deg: 70
  azimuth_deg: 90
  polarization: TE
  pol_s_amp: 1.0
  pol_s_phase_deg: 0
  pol_p_amp: 0.0
  pol_p_phase_deg: 0
  NG: 31
  order_min: -15
  order_max: 15
  recipe:
    fundamental_nm: 800
    harmonic_order_ranges:
      - {min: 55, max: 61, odd_only: true}
    angles_deg: [70]
    azimuths_deg: [0, 30, 45, 60, 90]

paths:
  s4_bin: null
  lua_script: lua/grating_slice_reflection.lua
  materials_db: ../shared
  output_dir: ../runs/inverse/crlb_mc/p80
  cache_size: 128

inverse:
  method: ga_lm
  order_collection: decoupling
  use_role_weights: false
  decoupling:
    enabled: true
    azimuth_tol_deg: 0.5
    roles:
      depth_anchor: { azimuth_deg: 90, orders: [0] }
      swa:          { azimuth_deg: 90, orders: [-1, 1] }
      lateral:
        azimuths_deg: [0, 30, 45, 60]
        orders: [0]
    static_weights:
      depth_anchor: 1.0
      swa: 0.8
      lateral: 1.0
      aux: 0.2
    dynamic_lm:
      enabled: false
      refresh_every_nfev: 20
      inner_max_nfev: 15
      outer_max_rounds: 10
      coupling_eps: 1.0e-3
      cd_reg_lambda0: 0.01
      boost_lateral_when_coupled: 2.0
      use_kx0_shadow_prior: true
    cd_anchor: ga
  param_names: [cd_nm, depth_nm, swa_deg]
  perturb_frac: 0.05
  bound_frac: 0.2
  reg_weight: 0.0
  noise:
    apply: true
    zero:
      camera: DoBEAM2000-2
      relative_a: 0.01
      n0_electrons: 1.0e6
      readout_e_rms: 5.0
      n_roi_pixels: 400
      dark_e_per_pixel_s: 125.0
      t_exp_s: 0.01
    first:
      camera: XV4040BSI-HG
      relative_a: 0.01
      n0_electrons: 1.0e6
      readout_e_rms: 2.5
      n_roi_pixels: 400
      dark_e_per_pixel_s: 0.01
      t_exp_s: 1.0
  use_ga: false
  use_lm: true
  ga_maxiter: 20
  ga_popsize: 36
  ga_mutation: [0.5, 1.0]
  ga_recombination: 0.7
  ga_seed: 0
  ga_workers: 1
  lm_max_nfev: 200
  lm_ftol: 1.0e-8
  lm_xtol: 1.0e-8
  lm_verbose: 0

library:
  file: ../data/inverse/spectra_hhg_swa05_phi5_swa1.npz
  build_workers: 1
  condition_workers: 8
  grid:
    cd_nm:    {min: 32, max: 48, step: 1.0}
    depth_nm: {min: 32, max: 48, step: 1.0}
    swa_deg: {min: 80, max: 95, step: 1.0}

eval:
  task: inverse
  mode: all
  n_trials: 40
  plot: true
  plot_dpi: 150

fim:
  eps_frac: 0.01
  keep_orders: [-1, 0, 1]
  masks: [prop, decoupling, m0_all, only90]
  azimuth_tol_deg: 0.5
  corr_masks: [prop, decoupling, m0_all, only90]
